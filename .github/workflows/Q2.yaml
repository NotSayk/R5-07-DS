name: Q2
on:
  push:
    paths:
      - 'TOTO.txt'
      - '.github/workflows/Q2.yaml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Créer Q2_archive_TOTO.txt
        run: |
          export TZ=Europe/Paris
          echo "NOM Prénom" > Q2_archive_TOTO.txt
          echo "Exécution du workflow : $(date '+%d/%m/%Y %H:%M:%S')" >> Q2_archive_TOTO.txt
          echo "----- Contenu de TOTO.txt -----" >> Q2_archive_TOTO.txt
          cat TOTO.txt >> Q2_archive_TOTO.txt
          echo "----- Taille de TOTO.txt -----" >> Q2_archive_TOTO.txt
          echo "$(wc -c < TOTO.txt) caractères, $(wc -l < TOTO.txt) lignes" >> Q2_archive_TOTO.txt
          cat Q2_archive_TOTO.txt

      - name: Commit et push
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add Q2_archive_TOTO.txt
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Q2 : archive datée de TOTO.txt"
          git pull --rebase
          git push
